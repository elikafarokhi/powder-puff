[project]
name = "powder-puff"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # fastapi needs it to read html forms
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "tzdata",
]

[dependency-groups]
dev = [
    "uvicorn>=0.30",
    "pytest>=8",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
