<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
{# email clients throw away <style> tags and outside css, so it's all inline #}
<body style="margin:0; padding:0; background:#eaf3fb;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eaf3fb;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:520px; background:#ffffff; border:1px solid #cfe1f0; border-radius:22px;
                    font-family:Helvetica, Arial, sans-serif; color:#1d3a57;">
        <tr>
          <td align="center" style="padding:32px 32px 4px;">
            <div style="font-size:52px; line-height:1;">🐻‍❄️</div>
            <h1 style="margin:12px 0 4px; font-size:26px; color:#3b78b5;">Powder day</h1>
            <p style="margin:0; font-size:15px; color:#6a8399;">
              {% if powder_days|length == 1 %}One of your mountains{% else %}{{ powder_days|length }} of your mountains{% endif %}
              got {{ threshold|int }}"+ overnight.
            </p>
          </td>
        </tr>

        {% for mountain, report in powder_days %}
        <tr>
          <td style="padding:{% if loop.first %}22px{% else %}10px{% endif %} 24px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f8fc; border-radius:16px;">
              <tr>
                <td style="padding:16px 18px;">
                  <a href="{{ mountain.maps_url }}" style="font-size:17px; font-weight:bold; color:#1d3a57; text-decoration:none;">{{ mountain.name }}</a>
                  {% if mountain.ikon %}
                  <span style="display:inline-block; margin-left:4px; padding:2px 8px; border-radius:999px; background:#1d3a57;
                               color:#ffffff; font-size:10px; font-weight:bold; letter-spacing:1px; vertical-align:2px;">IKON</span>
                  {% endif %}
                  <div style="margin-top:4px; font-size:13px; color:#6a8399;">
                    {{ report.last_24h_in }}" in 24 hrs
                    {%- if report.base_in is not none %} · {{ report.base_in }}" base{% endif %}
                    {%- if report.temp_c is not none %} · {{ report.temp_c|round|int }}°C at the top{% endif %}
                  </div>
                </td>
                <td align="right" style="padding:16px 18px; white-space:nowrap; font-size:30px; font-weight:bold; color:#3b78b5;">
                  {{ report.overnight_in }}"
                </td>
              </tr>
            </table>
          </td>
        </tr>
        {% endfor %}

        <tr>
          <td align="center" style="padding:26px 32px 10px;">
            <a href="{{ dashboard_url }}" style="display:inline-block; padding:12px 26px; border-radius:999px;
               background:#3b78b5; color:#ffffff; font-size:15px; font-weight:bold; text-decoration:none;">Open the dashboard</a>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:10px 32px 28px; font-size:12px; line-height:1.6; color:#8fa5b8;">
            You signed up for alerts at {{ threshold|int }}"+. Snow totals are estimates from Open-Meteo.<br>
            <a href="{{ manage_url }}" style="color:#6a8399;">Change my mountains</a> ·
            <a href="{{ unsubscribe_url }}" style="color:#6a8399;">Unsubscribe</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
